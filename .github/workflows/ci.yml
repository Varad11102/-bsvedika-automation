name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Reject likely committed secrets
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='.env.example' '(DB_PASSWORD|APP_KEY|SHARED_SECRET)=[^[:space:]]+' .; then
            echo "Potential secret detected."
            exit 1
          fi
